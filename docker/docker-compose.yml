version: '3.8'

services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: crypto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile-spark  # Reuse Spark Dockerfile for Python + Kafka
    command: ["python", "/app/kafka/producer.py"]
    depends_on:
      - kafka

  spark:
    build:
      context: ..
      dockerfile: docker/Dockerfile-spark
    volumes:
      - ../spark:/app/spark
    command: ["spark-submit", "/app/spark/stream_etl.py"]
    depends_on:
      - kafka
      - db

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ../dashboard:/app/dashboard
    command: ["streamlit", "run", "/app/dashboard/streamlit_app.py"]
    depends_on:
      - db

volumes:
  pg_data:
